[project]
name = "connector-mcp"
version = "0.1.0"
description = "国内工作平台连接器 MCP Server：邮件、钉钉、企微、飞书、WPS、文档、网盘、浏览器自动化"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # MCP 协议层为纯标准库同步实现（见 mcp_server.py 说明），不依赖官方 SDK/asyncio
    "keyring>=25.0.0",
    "imap-tools>=1.10.0",
    # QQ邮箱扫码向导：纯HTTP实现（requests 只是互联网客户端）。
    # 为什么不用 playwright/selenium/CDP：本机安全软件拦截一切本地监听端口，
    # 所有浏览器驱动方案（asyncio socketpair / msedgedriver / Edge调试端口）全部挂死
    "requests>=2.31.0",
]

[project.scripts]
connector-mcp = "connector.mcp_server:main"

[project.optional-dependencies]
dev = ["pyinstaller>=6.0.0", "pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connector"]
